name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pybullet has no macOS arm64 wheel and its sdist fails under modern
          # Xcode SDKs — only install the `physics` extra on Linux (where a
          # wheel exists). The macOS job exercises mjpython/mujoco, not pybullet.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install -e ".[dev,tracking,physics]"
          else
            pip install -e ".[dev,tracking]"
          fi

      - name: Lint with ruff
        if: runner.os == 'Linux'
        run: ruff check src/ tests/

      - name: Check formatting with black
        if: runner.os == 'Linux'
        run: black --check src/ tests/

      - name: Type check with mypy
        if: runner.os == 'Linux'
        # Mypy is non-blocking: the codebase has ~364 latent type errors
        # (pre-existing debt — mypy was previously never reached because ruff
        # failed first). Keep it running so the debt stays visible, but don't
        # block CI until the type cleanup workstream lands. Tracked separately.
        continue-on-error: true
        run: mypy src/surg_rl

      - name: Find mjpython (macOS)
        if: runner.os == 'macOS'
        id: mjpython
        run: |
          MJPYTHON=$(python -c '
          import mujoco, os, shutil
          # The mujoco package installs an mjpython console script under the
          # interpreter bin dir (the prior os.path.dirname(mujoco.__path__[0]) +
          # "/bin/mjpython" form resolved to <site-packages>/bin/mjpython which
          # does NOT exist). Prefer the console script on PATH; fall back to the
          # app-bundle binary shipped inside the mujoco package itself.
          cand = shutil.which("mjpython")
          if not cand or not os.path.exists(cand):
              cand = os.path.join(
                  mujoco.__path__[0],
                  "MuJoCo_(mjpython).app", "Contents", "MacOS", "mjpython",
              )
          print(cand)
          ')
          if [ ! -x "$MJPYTHON" ]; then
            echo "::error::mjpython not found (resolved to $MJPYTHON)"
            exit 1
          fi
          echo "path=$MJPYTHON" >> "$GITHUB_OUTPUT"
          echo "Found mjpython at: $MJPYTHON"

      - name: Test with pytest (Linux)
        if: runner.os == 'Linux'
        run: pytest tests/ -m "not integration" -v

      - name: Test with mjpython (macOS)
        if: runner.os == 'macOS'
        run: |
          ${{ steps.mjpython.outputs.path }} -m pytest tests/ \
            -m "not integration" \
            -v \
            --ignore=tests/test_ros2_bridge.py \
            --ignore=tests/test_ros2_cli.py \
            --ignore=tests/test_ros2_controller.py \
            --ignore=tests/test_ros2_replay.py

  docker-ci:
    name: Docker Build (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CUDA (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ROCm (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rocm
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Jetson (arm64)
        # INTERIM (non-gating): the base image
        # `nvcr.io/nvidia/l4t-pytorch:r36.4.0-pth2.5.0` referenced by
        # Dockerfile.jetson was NEVER published on NGC -- NVIDIA deprecated
        # the `l4t-pytorch` repo at JetPack 6 (last tag is r35.2.1-pth2.0-py3
        # for JetPack 5). The build fails with
        # `... not found` and there is no drop-in replacement tag available
        # yet. `continue-on-error: true` lets the docker-ci job go GREEN
        # (CPU/CUDA/ROCm are the gating builds) while a real base image is
        # pinned separately -- candidates: NVIDIA's official
        # `nvcr.io/nvidia/pytorch:<version>-igpu` (monthly releases, e.g.
        # 25.05-py3-igpu) or the community `dustynv/l4t-pytorch:r36.4.0` on
        # Docker Hub. DO NOT remove this guard until Dockerfile.jetson's FROM
        # line is updated to a published, pullable image.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-e2e:
    name: K8s PVC e2e (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,k8s-test]"

      # Preflight: fail fast with a clear message if the e2e overlay doesn't
      # kustomize-build, instead of letting the pytest step fail inside the kind
      # apply with a less obvious CalledProcessError. Catches the load-restrictor
      # regression class (resources referencing files outside the overlay dir).
      - name: Preflight kustomize build (e2e overlay)
        run: kubectl kustomize k8s/overlays/e2e >/dev/null

      - name: Run PVC e2e test (CPU-only kind cluster)
        run: pytest tests/k8s/test_pvc_e2e.py -m k8s -v --cluster-name=surg-rl-e2e

  dreamer-gpu:
    name: DreamerV3 GPU smoke
    # DMV3-10: real-agent smoke test on a GitHub-hosted GPU Actions runner (D-01).
    # Fires on merge-to-main + release tags + manual dispatch — NOT per-PR (D-02).
    # PR-time signal comes from the CPU-only regression guard + JAX-leak guard
    # in the `test` job's matrix; this job runs the flipped E2E test (40-02) +
    # the restart-then-continue resume test (40-03) + the regression guard
    # (40-01) against a real GPU. Structural-only assertions (finite +
    # non-explosive loss, checkpoint.ckpt exists, training completes, resume
    # takes effect) live in the tests themselves — NOT convergence thresholds
    # (DMV3-10 exclusion).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest-4-core-gpu
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-gpu-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gpu-pip-

      - name: Install CUDA-enabled jax
        # Install jax[cuda12] BEFORE the project extra so pip resolves jaxlib
        # against the CUDA build, not the CPU default (AI-SPEC Section 3).
        # The ~=0.4.20 line matches the pyproject pin (D-04 — pins UNCHANGED).
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cuda12]~=0.4.20"

      - name: Install project with dreamer + dev extras
        # dreamerv3~=1.5.0 + optax>=0.1.7 come from the [dreamer] extra (D-04).
        # jax is already installed with CUDA above, so pip keeps the CUDA build.
        run: pip install -e ".[dev,dreamer]"

      - name: Run dreamer smoke tests
        # total_steps=1000 / eval_every=500 is the smoke budget (D-03, ~3-5 min
        # on a GPU runner). The -rs flag surfaces skip reasons. On the GPU
        # runner the flipped E2E test + resume test RUN (not skip); the
        # regression guard also runs.
        env:
          DREAMER_TOTAL_STEPS: "1000"
          DREAMER_EVAL_EVERY: "500"
        run: pytest tests/dreamer/ -v -rs

      - name: Upload dreamerv3 checkpoint (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dreamerv3-checkpoint
          path: models/dreamerv3/
          if-no-files-found: ignore
